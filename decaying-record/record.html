<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Record Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Smooth button press feedback */
    .btn-press:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4 antialiased text-slate-800">

  <!-- Main Card Container (Approx. 460px by 520px, fully responsive) -->
  <main class="w-full max-w-[460px] min-h-[520px] bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-200/70 p-6 flex flex-col justify-between transition-all">
    
    <!-- Top & Middle Content -->
    <div>
      <!-- Large Image Placeholder -->
      <div 
        id="imagePlaceholder"
        class="w-full h-64 bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl flex flex-col items-center justify-center text-slate-400 select-none group hover:bg-slate-100/70 transition-colors"
        role="img" 
        aria-label="Image placeholder"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-slate-300 group-hover:text-slate-400 transition-colors mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
        </svg>
        <span class="text-xs font-medium uppercase tracking-wider text-slate-400">Image Placeholder</span>
      </div>

      <!-- Card Title -->
      <h1 class="text-xl font-bold tracking-tight text-slate-900 mt-5">
        Artifact Dossier #4092
      </h1>

      <!-- Subordinate Grey Text -->
      <p class="text-sm text-slate-500 mt-1 leading-normal">
        Captured during the mid-century restoration survey.
      </p>
    </div>

    <!-- Action Section -->
    <div class="mt-6 pt-2">
      <button 
        id="archiveButton"
        type="button"
        onclick="handleArchive()"
        class="btn-press w-full py-3 px-5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium transition-all duration-150 flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5m6 4.125l2.25 2.25m0 0l2.25-2.25M12 13.875V3.75M3.75 7.5h16.5" />
        </svg>
        <span>Archive this</span>
      </button>

      <!-- Feedback Banner (Hidden by default) -->
      <div 
        id="feedbackMessage" 
        class="hidden text-xs text-center text-emerald-700 font-medium mt-2 bg-emerald-50 border border-emerald-200/60 rounded-lg py-1.5 transition-all"
        role="status"
      >
        Item successfully archived.
      </div>
    </div>

  </main>

  <script>
    function handleArchive() {
      const button = document.getElementById('archiveButton');
      const feedback = document.getElementById('feedbackMessage');

      // Update button state
      button.disabled = true;
      button.classList.remove('bg-slate-900', 'hover:bg-slate-800');
      button.classList.add('bg-slate-300', 'text-slate-600', 'cursor-not-allowed');
      button.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
        </svg>
        <span>Archived</span>
      `;

      // Display non-blocking feedback message
      feedback.classList.remove('hidden');
    }
  </script>
</body>
</html>
