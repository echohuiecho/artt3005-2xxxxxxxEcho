<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Record Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .btn-press:active {
      transform: scale(0.98);
    }

    .card { perspective: 1200px; }

    .inner {
      position: relative;
      width: 100%;
      min-height: 520px;
      transition: transform 0.8s;
      transform-style: preserve-3d;
    }

    .card.flipped .inner { transform: rotateY(180deg); }

    .front,
    .back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
    }

    .back { transform: rotateY(180deg); }

    .field-value {
      letter-spacing: 0;
      opacity: 1;
      filter: blur(0);
      transition:
        filter 10s ease,
        opacity 10s ease,
        letter-spacing 10s ease;
    }

    /* B6 — "What was not captured" stays readable, then fades at the end */
    .field-value-last {
      transition:
        filter 4s ease,
        opacity 4s ease,
        letter-spacing 4s ease;
      transition-delay: 11s;
    }

    .card.decaying .field-value {
      filter: blur(8px);
      opacity: 0;
      letter-spacing: 0.35em;
    }

    /* B5 — catalog, labels, and border stay sharp; only values decay */
    .persistent {
      filter: none;
      opacity: 1;
      transition: none;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4 antialiased text-slate-800">

  <div id="card" class="card w-full max-w-[460px]">
    <div class="inner">

      <!-- Front face -->
      <main class="front w-full min-h-[520px] bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-200/70 p-6 flex flex-col justify-between">

        <div>
          <img
            id="recordImage"
            alt=""
            class="w-full h-64 object-cover rounded-xl bg-slate-50 border border-slate-200/70"
          />

          <h1 id="frontTitle" class="text-xl font-bold tracking-tight text-slate-900 mt-5"></h1>

          <p id="frontPlace" class="text-sm text-slate-500 mt-1 leading-normal"></p>
        </div>

        <div class="mt-6 pt-2">
          <button
            id="archiveButton"
            type="button"
            onclick="handleArchive()"
            class="btn-press w-full py-3 px-5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium transition-all duration-150 flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5m6 4.125l2.25 2.25m0 0l2.25-2.25M12 13.875V3.75M3.75 7.5h16.5" />
            </svg>
            <span>Archive this</span>
          </button>

          <div
            id="feedbackMessage"
            class="hidden text-xs text-center text-emerald-700 font-medium mt-2 bg-emerald-50 border border-emerald-200/60 rounded-lg py-1.5 transition-all"
            role="status"
          >
            Item successfully archived.
          </div>
        </div>

      </main>

      <!-- Back face — archival specimen label -->
      <div class="back w-full min-h-[520px] bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-200/70 p-6 flex items-center justify-center">
        <div class="persistent specimen-label w-full h-full border border-slate-400/80 bg-stone-50 p-5 font-mono text-sm text-slate-800 flex flex-col">
          <p id="catalogId" class="persistent catalog-id text-xs uppercase tracking-[0.2em] text-slate-500 border-b border-slate-300 pb-3 mb-5">
            Catalog No.
          </p>

          <dl class="space-y-4 flex-1">
            <div>
              <dt class="persistent field-label text-[10px] uppercase tracking-wider text-slate-500 mb-1">Title</dt>
              <dd id="fieldTitle" class="field-value leading-snug"></dd>
            </div>
            <div>
              <dt class="persistent field-label text-[10px] uppercase tracking-wider text-slate-500 mb-1">Date and place</dt>
              <dd id="fieldDatePlace" class="field-value leading-snug"></dd>
            </div>
            <div>
              <dt class="persistent field-label text-[10px] uppercase tracking-wider text-slate-500 mb-1">Recorded by</dt>
              <dd id="fieldRecorder" class="field-value leading-snug"></dd>
            </div>
            <div>
              <dt class="persistent field-label text-[10px] uppercase tracking-wider text-slate-500 mb-1">What was not captured</dt>
              <dd id="fieldNotCaptured" class="field-value field-value-last leading-snug text-slate-600 italic"></dd>
            </div>
          </dl>
        </div>
      </div>

    </div>
  </div>

  <script>
    async function loadRecord() {
      const response = await fetch('record.json', { cache: 'no-store' });
      if (!response.ok) throw new Error('record.json did not load');
      const record = await response.json();

      const image = document.getElementById('recordImage');
      image.src = new URL(record.image, window.location.href).href;
      image.alt = record.title;
      document.getElementById('frontTitle').textContent = record.title;
      document.getElementById('frontPlace').textContent = record.place;

      document.getElementById('catalogId').textContent = `Catalog No. ${record.catalog_id}`;
      document.getElementById('fieldTitle').textContent = record.title;
      document.getElementById('fieldDatePlace').textContent = `${record.date} · ${record.place}`;
      document.getElementById('fieldRecorder').textContent = record.recorder;
      document.getElementById('fieldNotCaptured').textContent = record.not_captured;
    }

    loadRecord();

    function handleArchive() {
      const card = document.getElementById('card');
      const button = document.getElementById('archiveButton');
      const feedback = document.getElementById('feedbackMessage');

      card.classList.add('flipped');

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          card.classList.add('decaying');
        });
      });

      button.disabled = true;
      button.classList.remove('bg-slate-900', 'hover:bg-slate-800');
      button.classList.add('bg-slate-300', 'text-slate-600', 'cursor-not-allowed');
      button.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
        </svg>
        <span>Archived</span>
      `;

      feedback.classList.remove('hidden');
    }
  </script>
</body>
</html>
